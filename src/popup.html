<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DeepSeek 朗读下载器</title>
<style>
  body{margin:0;width:280px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;color:#1b1b1f;background:#fff}
  .wrap{padding:14px}
  h1{margin:0 0 8px;font-size:14px}
  #status{margin:0 0 12px;font-size:12px;line-height:1.6;color:#6b6b6b}
  button{display:block;width:100%;height:34px;margin-bottom:8px;border:1px solid rgba(0,0,0,.14);border-radius:9px;background:#fff;color:#1b1b1f;font-size:13px;cursor:pointer}
  button:hover{background:#f2f2f7}
  button.primary{background:#4d6bfe;border-color:#4d6bfe;color:#fff}
  button.primary:hover{background:#3f5be8}
  .tip{margin:10px 0 0;font-size:11px;line-height:1.6;color:#8a8a93}
  @media (prefers-color-scheme: dark){
    body{background:#1f2023;color:#e9e9ec}
    #status{color:#9a9aa3}
    button{background:#2e2f34;border-color:rgba(255,255,255,.14);color:#e9e9ec}
    button:hover{background:#3a3b41}
    button.primary{background:#4d6bfe;border-color:#4d6bfe;color:#fff}
    .tip{color:#7d7d86}
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>DeepSeek 朗读下载器</h1>
    <p id="status">正在检测页面…</p>
    <button id="open" class="primary">打开下载面板</button>
    <button id="last">下载最后一条回答的朗读</button>
    <p class="tip">下载的是官方 TTS 合成的 24kHz 单声道 WAV，会消耗一次朗读额度。首次安装后需要刷新 chat.deepseek.com。</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
